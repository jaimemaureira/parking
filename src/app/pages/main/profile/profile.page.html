<app-header backButton="/main/home" title=" Estacionamientos"></app-header>
<app-header backButton="home" title="Perfil"></app-header>

<ion-content>

  
  <ion-card color="primary">
    <ion-card-header>
      <ion-card-title>Datos Personales</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-item >
        <ion-label style="color: orange;" position="floating">Nombre de usuario</ion-label>
        <ion-input type="text" style="color: rgb(45, 91, 240)" [(ngModel)]="userName"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label style="color: orange;" position="floating">Correo electronico</ion-label>
        <ion-input type="email" style="color: rgb(45, 91, 240)" [(ngModel)]="email"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label style="color: orange;" position="floating">Rol</ion-label>
        <ion-input type="text" style="color: rgb(45, 91, 240)" [(ngModel)]="rol"></ion-input>
      </ion-item>
    </ion-card-content>
  </ion-card>
  <ion-card color="primary">
    <ion-card-header>
      <ion-card-title>Informacion general</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-item >
        <ion-label style="color: orange;" position="floating">Agrega un avatar</ion-label><br>
        <ion-button >Selecciona una imagen </ion-button>
        
      </ion-item>
      <ion-item>
        <ion-label style="color: orange;" position="floating">Correo electronico</ion-label>
        <ion-input type="email" style="color: rgb(45, 91, 240)" [(ngModel)]="email"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label style="color: orange;" position="floating">Rol</ion-label>
        <ion-input type="text" style="color: rgb(45, 91, 240)" [(ngModel)]="rol"></ion-input>
      </ion-item>
    </ion-card-content>
  </ion-card>

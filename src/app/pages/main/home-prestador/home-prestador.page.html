<app-header title="Panel Prestador">
</app-header>

<ion-content>

  <div class="menu-home">

    <div class="img-avatar">
      <ion-icon class="image-icon" name="image-outline"></ion-icon>
      <br>
      <a href>Tú Perfil</a>
      <br>
      
        
        
      
    </div>

    <h6><p>Panel de administración de estacionamientos</p></h6>

    <!-- ======== nuevo estacionameinto ========= -->

    <ion-button vertical="3" color="primary" mode="ios"
    (keydown.enter)="addUpdateProduct()" (click)="addUpdateProduct()" class="add-circle-outline">
      <ion-icon name="add-circle-outline"></ion-icon>&nbsp;
      Agregar estacionamientos
    </ion-button>

    <ion-button vertical="3" color="primary" mode="ios"
      routerLink="/parking-view" class="add-circle-outline">
      <ion-icon name="eye-outline"></ion-icon>&nbsp;
      Mis estacionamientos
    </ion-button>


    <ion-button vertical color="primary" mode="ios" (click)="addUpdateProduct()"
    (keydown.enter)="addUpdateProduct()" class="add-circle-outline">
      <ion-icon name="car-sport-outline"></ion-icon>&nbsp;
      Consigue estacionamiento
    </ion-button>

    <ion-button vertical="3" color="primary" mode="ios"
      routerLink="/vehiculo" class="add-circle-outline">
      <ion-icon name="car-sport-outline"></ion-icon>&nbsp;
      Agregar vehiculo
    </ion-button>

    

    
    <ion-fab vertical="bottom" horizontal="end" slot="fixed">
      <ion-fab-button (click)="signOut()">
        <ion-icon name="exit-outline"></ion-icon>&nbsp;
      </ion-fab-button>
    </ion-fab>

  </div>

</ion-content>
